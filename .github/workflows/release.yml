name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.5.0)'
        required: true
        default: '1.5.0'

env:
  APK_PATH: AlcedoAndroid/app/build/outputs/apk/release/app-release.apk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AlcedoAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: 35.0.0
          ndk-version: 27.0.12077973
          cmake-version: 3.22.1

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            AlcedoAndroid/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('AlcedoAndroid/**/*.gradle*', 'AlcedoAndroid/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Set up signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "Setting up release signing from secrets..."
            echo "$SIGNING_KEYSTORE" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
            echo "keystore.properties created."
          else
            echo "::warning::No signing secrets found. Release APK will be signed with the debug key and must be re-signed before distribution."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --no-build-cache

      - name: Verify APK artifact exists
        run: |
          # path is relative to repo root, not the working directory
          APK_ABS="$GITHUB_WORKSPACE/$APK_PATH"
          if [ ! -f "$APK_ABS" ]; then
            echo "::error::Release APK not found at $APK_ABS"
            echo "Listing build outputs directory for diagnostics:"
            ls -la "$GITHUB_WORKSPACE/AlcedoAndroid/app/build/outputs/apk/" 2>/dev/null || true
            find "$GITHUB_WORKSPACE/AlcedoAndroid/app/build/outputs" -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK size: $(du -h "$APK_ABS" | cut -f1)"
          ls -la "$APK_ABS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifact

      - name: Verify downloaded artifact
        run: |
          ls -la artifact/
          if [ ! -f artifact/app-release.apk ]; then
            echo "::error::app-release.apk missing from downloaded artifact"
            exit 1
          fi

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=v${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Alcedo Studio ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: artifact/app-release.apk
