name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ALCEDO_KEYSTORE_PASSWORD: ${{ secrets.ALCEDO_KEYSTORE_PASSWORD }}
      ALCEDO_KEY_ALIAS: ${{ secrets.ALCEDO_KEY_ALIAS }}
      ALCEDO_KEY_PASSWORD: ${{ secrets.ALCEDO_KEY_PASSWORD }}
      # Disable configuration cache to avoid "external process" errors from git describe
      ORG_GRADLE_PROJECT_org.gradle.configuration-cache: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # If triggered manually, checkout the specified tag
      - name: Checkout tag (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags
          git checkout "${{ inputs.tag }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('AlcedoAndroid/**/*.gradle.kts', 'AlcedoAndroid/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x AlcedoAndroid/gradlew

      - name: Decode Keystore
        id: keystore
        env:
          ALCEDO_KEYSTORE_BASE64: ${{ secrets.ALCEDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ALCEDO_KEYSTORE_BASE64" ]; then
            echo "$ALCEDO_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/alcedo-release.keystore"
            echo "ALCEDO_KEYSTORE_PATH=${{ runner.temp }}/alcedo-release.keystore" >> "$GITHUB_ENV"
            echo "decoded=true" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: ALCEDO_KEYSTORE_BASE64 is empty, skipping keystore decode"
            echo "decoded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        working-directory: AlcedoAndroid
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        working-directory: AlcedoAndroid
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            ls -laR app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          # Determine tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Validate tag format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid tag format: $TAG (expected v*.*.*)"
            exit 1
          fi
          DEST="AlcedoStudio-${TAG}.apk"
          cp "$APK_PATH" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK size: $(du -h "$DEST" | cut -f1)"

      - name: Verify APK
        run: |
          APK_PATH="AlcedoAndroid/${{ steps.apk.outputs.apk_path }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          # Basic sanity check: APK must be > 1MB
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo 0)
          echo "APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 1048576 ]; then
            echo "WARNING: APK is suspiciously small ($APK_SIZE bytes), may be unsigned or corrupt"
          fi
          # Try apksigner if available
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS" ] && [ -f "${BUILD_TOOLS}apksigner" ]; then
            echo "Verifying APK signature..."
            "${BUILD_TOOLS}apksigner" verify --print-certs "$APK_PATH" || echo "Signature verification failed (may be debug-signed)"
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag for changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")
          else
            CHANGELOG=$(git log -20 --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")
          fi
          # Write to file for multiline output
          {
            echo "## Alcedo Studio ${{ steps.apk.outputs.tag }}"
            echo ""
            echo "### Changes"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "- See commit history for details"
            fi
            echo ""
            echo "### Supported Formats"
            echo "JPEG, PNG, WEBP, BMP, GIF, TIFF, HEIC, HEIF, EXR,"
            echo "ARW, CR2, CR3, NEF, DNG, ORF, PEP, SRW, X3F, RAF, RW2, MOS"
          } > release_notes.md
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: AlcedoAndroid/${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          files: AlcedoAndroid/${{ steps.apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            AlcedoAndroid/app/build/reports/
            AlcedoAndroid/app/build/outputs/logs/
            AlcedoAndroid/build/reports/
          retention-days: 7
