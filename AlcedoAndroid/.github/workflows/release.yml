name: Release Build (Legacy subdir)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v1.3.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build tag
        id: resolve_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG not found locally; will use it as output anyway"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid tag format: $TAG (expected vX.Y.Z like v1.3.4)"
            exit 1
          fi
          echo "Building release for tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          git fetch --tags || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git checkout "$TAG"
          else
            echo "Tag $TAG does not exist; tagging current HEAD as $TAG for build"
            git tag "$TAG" HEAD || true
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Enable KVM for Android emulator / faster build
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-alcedo-${{ hashFiles('AlcedoAndroid/**/*.gradle.kts', 'AlcedoAndroid/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-alcedo-
            gradle-

      - name: Grant execute permission
        working-directory: AlcedoAndroid
        run: chmod +x gradlew

      - name: Setup signing keystore
        id: keystore
        env:
          ALCEDO_KEYSTORE_BASE64: ${{ secrets.ALCEDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ALCEDO_KEYSTORE_BASE64" ] && [ "$ALCEDO_KEYSTORE_BASE64" != "" ]; then
            KEYSTORE_PATH="${{ runner.temp }}/alcedo-release.keystore"
            echo "$ALCEDO_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            KS_SIZE=$(stat -c%s "$KEYSTORE_PATH" 2>/dev/null || stat -f%z "$KEYSTORE_PATH" 2>/dev/null || echo 0)
            echo "Signing keystore configured: $KS_SIZE bytes"
            echo "ALCEDO_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "decoded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found - will use debug signing fallback"
            echo "decoded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        working-directory: AlcedoAndroid
        id: build_apk
        env:
          ALCEDO_KEYSTORE_PASSWORD: ${{ secrets.ALCEDO_KEYSTORE_PASSWORD }}
          ALCEDO_KEY_ALIAS: ${{ secrets.ALCEDO_KEY_ALIAS }}
          ALCEDO_KEY_PASSWORD: ${{ secrets.ALCEDO_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_org.gradle.configuration-cache: "false"
        run: |
          set -o pipefail
          if [ -n "$ALCEDO_KEYSTORE_PATH" ]; then
            export ALCEDO_KEYSTORE_PATH
            echo "Using release keystore: $ALCEDO_KEYSTORE_PATH"
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_output.log | tail -200
          exit ${PIPESTATUS[0]}

      - name: Collect APK artifacts
        id: collect_apk
        working-directory: AlcedoAndroid
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK produced!"
            ls -laR app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo 0)
          if [ "$APK_SIZE" -lt 1048576 ]; then
            echo "ERROR: APK size too small ($APK_SIZE bytes)"
            exit 1
          fi
          APK_SIZE_MB=$(( (APK_SIZE + 1048575) / 1048576 ))
          DEST="../AlcedoStudio-${TAG}.apk"
          cp -f "$APK_PATH" "$DEST"
          mkdir -p artifacts
          cp -f "$APK_PATH" "artifacts/AlcedoStudio-${TAG}.apk"
          ls -la artifacts/
          echo "apk_path=artifacts/AlcedoStudio-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_size_mb=$APK_SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify APK signing
        id: verify_signing
        working-directory: AlcedoAndroid
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found for signing verification"
            exit 1
          fi
          SIGNING_OK=true
          # Check v1 signing (JAR signing - META-INF/*.SF)
          if unzip -l "$APK_PATH" | grep -q "META-INF/.*\.SF"; then
            echo "v1 (JAR) signing: OK"
          else
            echo "v1 (JAR) signing: NOT FOUND"
            SIGNING_OK=false
          fi
          # Check v2 signing (APK Signature Scheme v2 - exists in APK Signing Block)
          if python3 -c "
          import sys, struct
          with open(sys.argv[1], 'rb') as f:
            f.seek(-22, 2)
            eocd = f.read(22)
            if eocd[:4] != b'\x50\x4b\x05\x06':
              sys.exit(1)
            cd_offset = struct.unpack('<I', eocd[16:20])[0]
            f.seek(cd_offset - 16)
            magic = f.read(16)
            if magic == b'APK Sig Block 42':
              sys.exit(0)
            sys.exit(1)
          " "$APK_PATH" 2>/dev/null; then
            echo "v2 (APK Signature Scheme) signing: OK"
          else
            # Fallback: check via $ANDROID_HOME build-tools apkanalyzer if available
            APKSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1)
            if [ -n "$APKSIGNER" ]; then
              VERIFY_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1) && {
                echo "v2 signing verified via apksigner"
                echo "$VERIFY_OUTPUT"
              } || {
                echo "WARNING: apksigner verification failed"
                echo "$VERIFY_OUTPUT"
                SIGNING_OK=false
              }
            else
              echo "v2 signing: Could not verify (no apksigner, and APK Signing Block not detected via python fallback)"
              SIGNING_OK=false
            fi
          fi
          if [ "$SIGNING_OK" = false ]; then
            echo "WARNING: APK signing verification incomplete - APK may not be properly signed"
            echo "signing_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "APK signing verification passed"
            echo "signing_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ steps.resolve_tag.outputs.tag }}
          path: AlcedoAndroid/artifacts/
          retention-days: 90
          if-no-files-found: error

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=""
          # Strategy 1: Try HEAD^ (parent of current commit)
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || echo "")
          fi
          # Strategy 2: List all tags sorted by version, pick the one before current
          if [ -z "$PREV_TAG" ]; then
            CURRENT_TAG="${{ steps.resolve_tag.outputs.tag }}"
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1 | grep -v "^${CURRENT_TAG}$" || echo "")
          fi
          # Strategy 3: Just use the second-to-last tag by version
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | head -2 | tail -1 || echo "")
          fi
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag found: $PREV_TAG"
            echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
            git log --oneline --no-merges "$PREV_TAG..HEAD" >> "$GITHUB_OUTPUT" || echo "- (no changes)"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "No previous tag found; showing recent commits"
            echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
            git log --oneline --no-merges -15 >> "$GITHUB_OUTPUT" || echo "- Initial release"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release metadata
        id: release_meta
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: Alcedo Studio ${{ steps.resolve_tag.outputs.tag }}
          body: |
            ## Release Information

            - **Build tag**: ${{ steps.resolve_tag.outputs.tag }}
            - **APK size**: ${{ steps.collect_apk.outputs.apk_size_mb }} MB
            - **Build date**: ${{ steps.release_meta.outputs.build_date }}

            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            - Download the APK from the Assets below
            - Install by opening on your Android device (allow unknown sources if needed)
            - Existing installations can be updated in-place without data loss
          files: AlcedoAndroid/artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            AlcedoAndroid/app/build/reports/
            AlcedoAndroid/app/build/outputs/logs/
            AlcedoAndroid/build/reports/
            AlcedoAndroid/build_output.log
          retention-days: 30
          if-no-files-found: ignore