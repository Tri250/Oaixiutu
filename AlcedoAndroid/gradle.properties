org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
# Room 2.6.1 hits "unexpected jvm signature V" under KSP2 with Kotlin 2.1.0
# (https://issuetracker.google.com/issues/325388832). KSP1 is stable for Room
# 2.6.x; flip back to KSP2 once Room is upgraded to 2.7.0+.
ksp.useKSP2=false

# Force IPv4 — the sandbox has no routable IPv6, which causes Gradle's
# HTTP client to throw "Network is unreachable" for Maven Central.
systemProp.java.net.preferIPv4Stack=true
# Fail fast on unreachable mirrors so Gradle moves to the next repository
# instead of blocking for the full 60s default timeout.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
