# JVM args - proxy settings removed, use GRADLE_OPTS env if proxy needed
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=35
# Build performance - enabled for CI/CD efficiency
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=false

# R8 full mode DISABLED for v1.3.3 release — full mode performs aggressive
# class merging / method inlining that can break Compose, Room, Kotlin
# serialization, and ONNX Runtime at runtime even with comprehensive keep rules.
# Re-enable only after thorough runtime testing on a physical device.
android.enableR8.fullMode=false
