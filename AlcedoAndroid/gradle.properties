# ================================================================
# Gradle 性能优化配置
# ================================================================
# JVM 参数：
#   -Xmx6144m              : 最大堆内存 6GB（原 4GB，多模块+Compose 编译需要更多内存）
#   -XX:MaxMetaspaceSize=1g: 元空间上限 1GB（原 512MB，Kotlin 反射/注解处理器占用较大）
#   -XX:+UseParallelGC     : 使用并行垃圾回收器，提高 GC 吞吐量适合构建场景
#   -XX:ParallelGCThreads=4: 并行 GC 线程数 4（避免与构建线程争抢）
#   -XX:+UseStringDeduplication: 字符串去重，减少内存占用
#   -Dkotlin.daemon.jvm.options=-Xmx2g: Kotlin 守护进程独立 2GB 堆
#   -Dfile.encoding=UTF-8  : 统一文件编码
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:ParallelGCThreads=4 -XX:+UseStringDeduplication -Dkotlin.daemon.jvm.options=-Xmx2g -Dfile.encoding=UTF-8

# 启用 AndroidX（Android 生态系统强制要求）
android.useAndroidX=true

# Kotlin 代码风格配置
kotlin.code.style=official

# 启用非传递 R 类，减少构建时间和 APK 体积
android.nonTransitiveRClass=true

# Jetifier：将旧 support library 依赖迁移到 AndroidX
android.enableJetifier=true

# 抑制不支持的 compileSdk 警告（允许使用比 AGP 目标更新的 SDK）
android.suppressUnsupportedCompileSdk=35

# ================================================================
# Gradle 构建性能优化
# ================================================================

# 启用 Gradle Daemon（守护进程），避免每次构建都重新启动 JVM
org.gradle.daemon=true

# 启用并行项目构建（多模块项目有效），大幅提升多模块构建速度
org.gradle.parallel=true

# Worker 执行器最大线程数：此处设为 8（适合 8 核以上机器）
# 建议值：CPU 核心数，最少 4，最多 8-16
org.gradle.workers.max=8

# 启用构建缓存（本地 + 远程可复用），避免重复任务
org.gradle.caching=true

# 配置缓存：暂设为 false（Compose/KAPT/KSP 等可能有兼容性问题）
# 当确认所有插件都兼容时可改为 true，进一步提升配置阶段速度
# 参考：https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=false

# Kotlin 增量编译：加快 Kotlin 代码编译速度（仅重编译变更模块）
kotlin.incremental=true

# Kotlin 编译缓存：跨构建复用编译结果
kotlin.caching.enabled=true

# R8 full mode DISABLED for v1.3.3 release — full mode performs aggressive
# class merging / method inlining that can break Compose, Room, Kotlin
# serialization, and ONNX Runtime at runtime even with comprehensive keep rules.
# Re-enable only after thorough runtime testing on a physical device.
android.enableR8.fullMode=false
